<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 20px;
            font-size: 1.8em;
            color: #333;
        }

        .login-container form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .login-container label {
            margin-bottom: 5px;
            font-weight: bold;
            text-align: left;
            color: #555;
        }

        .login-container input {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .login-container button {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Seller Register</h1>
        {% if error %}
        <p class="error-message">{{ error }}</p>
        {% endif %}
        <form action="/sellers/register" method="post">
            <label for="inn">INN:</label>
            <input type="text" id="inn" name="inn" value="{{ inn or '' }}" required>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ name or '' }}" required>

            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" value="{{ phone or '' }}" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" value="{{ address or '' }}" required>

            <label for="store_name">Store name:</label>
            <input type="text" id="store_name" name="store_name" value="{{ store_name or '' }}" required>

            <label for="store_description">Store Description:</label>
            <input type="text" id="store_description" name="store_description" value="{{ store_description or '' }}" required>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
